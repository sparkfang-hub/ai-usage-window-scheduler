[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-window-scheduler"
version = "0.3.2"
description = "Schedule AI usage windows and display usage/reset times across providers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sparkfang-hub"}]
keywords = ["claude", "chatgpt", "grok", "gemini", "ai", "scheduler", "usage", "macos", "menubar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
widget = ["rumps>=0.4.0,<1"]

[project.scripts]
ai-window = "ai_window.cli_v2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
