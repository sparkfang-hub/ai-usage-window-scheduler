name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[widget]'
      - run: python -m unittest discover -s tests -v
      - run: ai-window --version
      - name: Build standalone macOS app
        env:
          VERSION: 0.3.1
        run: |
          chmod +x scripts/build_macos_app.sh
          ./scripts/build_macos_app.sh
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: AI-Usage-Window-Scheduler-macOS-arm64-v0.3.1
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
