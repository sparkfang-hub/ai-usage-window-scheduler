name: macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (for example 0.3.0)
        required: true
        default: 0.3.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: |
          python -m pip install -e '.[widget]'
          python -m unittest discover -s tests -v

      - name: Build standalone app, zip and dmg
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          chmod +x scripts/build_macos_app.sh
          ./scripts/build_macos_app.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Usage-Window-Scheduler-macOS-arm64-v${{ steps.version.outputs.value }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --title "AI Usage Window Scheduler $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
